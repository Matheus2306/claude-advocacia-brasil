name: Validar e empacotar skills

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar e gerar pacotes
        run: python scripts/validate_and_package.py

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: claude-advocacia-skills
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
